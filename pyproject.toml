[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "air-canvas"
version = "0.1.0"
description = "손가락으로 허공에 그린 그림/글씨를 AI가 인식해 디지털 도형·텍스트·다이어그램 코드로 바꿔주는 스마트 화이트보드"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "mediapipe>=0.10.14",
]

[project.optional-dependencies]
# Hugging Face OCR/Vision 모델. torch가 무거우니 필요한 사람만 설치: pip install -e ".[ocr]"
ocr = [
    "transformers>=4.40",
    "torch>=2.2",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
air-canvas = "air_canvas.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
