name: '이슈 생성'
description: '이슈를 만들면 입력한 이름으로 작업 브랜치가 자동 생성됩니다.'

body:
  - type: input
    id: branch
    attributes:
      label: '🌳 브랜치명 (Branch)'
      description: '생성할 브랜치명을 입력해 주세요. 띄어쓰기는 -로 바뀝니다.'
      placeholder: '손 랜드마크 추적 구현'
    validations:
      required: true

  - type: dropdown
    id: branchType
    attributes:
      label: '📂 브랜치 타입 (branchType)'
      description: '작업 타입을 선택하세요'
      options:
        - feat
        - fix
        - refactor
        - test
        - docs
        - style
        - chore
        - ci
        - hotfix
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: '🧩 모듈 (Module)'
      description: '주로 수정하는 모듈을 선택하세요'
      options:
        - tracking (손가락 추적)
        - canvas (공중 캔버스 / 렌더링)
        - gestures (제스처 커맨드)
        - recognition (AI 인식)
        - export (SVG / Mermaid 내보내기)
        - app (통합 파이프라인)
        - core (공통 인터페이스)
        - docs / ci / 기타
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: '📝 상세 내용 (Description)'
      description: '이슈에 대해서 간략히 설명해 주세요'
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: '✅ 체크리스트 (Tasks)'
      description: '이 작업에서 수행해야 할 내용을 작성해 주세요'
      value: |
        - [ ] 작업 항목 1
        - [ ] 작업 항목 2
    validations:
      required: true
