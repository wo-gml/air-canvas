name: 버그 리포트
description: 잘못 동작하는 부분을 알려주세요
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 문제인가요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. `python -m air_canvas` 실행
        2. 검지로 원을 그림
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
  - type: input
    id: env
    attributes:
      label: 환경
      placeholder: "macOS 15 / Python 3.11 / 내장 웹캠"
  - type: textarea
    id: logs
    attributes:
      label: 에러 로그 / 스크린샷
      render: shell
