name: Auto Create Branch

# 이슈 폼(issue-form.yml)으로 이슈를 만들면
#   1) 이슈 제목을 "[Feature] #12 제목" 형식으로 바꾸고 라벨과 담당자를 붙인 뒤
#   2) main에서 "feat/#12-브랜치명" 브랜치를 만들고
#   3) 이슈에 브랜치 이름을 댓글로 남깁니다.

on:
  issues:
    types: [opened]

jobs:
  create-branch:
    # 공개 레포라 아무나 이슈를 열 수 있으므로, 레포 소유자와 협업자의 이슈에서만 실행
    if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write

    steps:
      - name: Extract branch information
        id: extract
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf '%s\n' "$ISSUE_BODY" > issue_body.txt

          # 이슈 폼 본문에서 "### 제목" 다음에 오는 첫 값 읽기
          field() {
            awk -v h="$1" '
              /^### / { found = index($0, h) > 0; next }
              found && NF { print; exit }
            ' issue_body.txt | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
          }

          BRANCH_NAME=$(field "(Branch)")
          BRANCH_TYPE=$(field "(branchType)" | tr '[:upper:]' '[:lower:]')

          echo "추출된 브랜치 타입: $BRANCH_TYPE"
          echo "추출된 브랜치명: $BRANCH_NAME"

          # 브랜치 타입 검증 + 이슈 제목 타입 / 라벨 매핑
          case "$BRANCH_TYPE" in
            feat)     ISSUE_TYPE="Feature";  ISSUE_LABEL="✨ Feature" ;;
            fix)      ISSUE_TYPE="BugFix";   ISSUE_LABEL="🐛 BugFix" ;;
            hotfix)   ISSUE_TYPE="BugFix";   ISSUE_LABEL="🐛 BugFix" ;;
            refactor) ISSUE_TYPE="Refactor"; ISSUE_LABEL="♻️ Refactor" ;;
            test)     ISSUE_TYPE="Test";     ISSUE_LABEL="✅ Test" ;;
            docs)     ISSUE_TYPE="Docs";     ISSUE_LABEL="📋 Docs" ;;
            style)    ISSUE_TYPE="Style";    ISSUE_LABEL="🎨 Style" ;;
            chore)    ISSUE_TYPE="Chore";    ISSUE_LABEL="🛠️ Chore" ;;
            ci)       ISSUE_TYPE="CI";       ISSUE_LABEL="⚙️ CI" ;;
            *)
              echo "❌ 허용되지 않은 브랜치 타입입니다: $BRANCH_TYPE"
              exit 1
              ;;
          esac

          # 기존 [Type], #번호 접두사 제거 후 새 이슈 제목 생성
          CLEAN_TITLE=$(printf '%s' "$ISSUE_TITLE" \
            | sed -E 's/^\[[^]]+\][[:space:]]*//; s/^#[0-9]+[[:space:]]*//')
          NEW_ISSUE_TITLE="[${ISSUE_TYPE}] #${ISSUE_NUMBER} ${CLEAN_TITLE}"

          # 브랜치명 정리: 공백 -> '-', git에서 못 쓰는 문자 제거
          BRANCH_NAME=$(printf '%s' "$BRANCH_NAME" \
            | sed -E 's/[[:space:]]+/-/g; s/[:^~?*\\[]//g; s/\.\.//g; s/@\{//g; s/-+/-/g; s#^[-/.]+##; s#[-/.]+$##')

          if [ -z "$BRANCH_NAME" ]; then
            echo "❌ 브랜치명을 찾을 수 없습니다."
            exit 1
          fi

          FINAL_BRANCH_NAME="${BRANCH_TYPE}/#${ISSUE_NUMBER}-${BRANCH_NAME}"

          if ! git check-ref-format --branch "$FINAL_BRANCH_NAME" >/dev/null; then
            echo "❌ 사용할 수 없는 브랜치명입니다: $FINAL_BRANCH_NAME"
            exit 1
          fi

          echo "최종 브랜치명: $FINAL_BRANCH_NAME"
          echo "새 이슈 제목: $NEW_ISSUE_TITLE"

          {
            echo "branch_name=$FINAL_BRANCH_NAME"
            echo "new_issue_title=$NEW_ISSUE_TITLE"
            echo "label=$ISSUE_LABEL"
          } >> "$GITHUB_OUTPUT"

      - name: Update issue metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          NEW_ISSUE_TITLE: ${{ steps.extract.outputs.new_issue_title }}
          ISSUE_LABEL: ${{ steps.extract.outputs.label }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --title "$NEW_ISSUE_TITLE" \
            --add-label "$ISSUE_LABEL" \
            --add-assignee "$ISSUE_AUTHOR"

      - name: Create branch from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ steps.extract.outputs.branch_name }}
        run: |
          MAIN_SHA=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$BRANCH_NAME" -f sha="$MAIN_SHA" > /dev/null
          echo "브랜치 '$BRANCH_NAME' 생성 완료 (main @ ${MAIN_SHA:0:7})"

      - name: Add branch comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH_NAME: ${{ steps.extract.outputs.branch_name }}
        run: |
          BODY=$(printf '🌿 브랜치가 생성되었습니다!\n\n```bash\ngit fetch origin\ngit switch %s\n```' "$BRANCH_NAME")
          gh issue comment "$ISSUE_NUMBER" --body "$BODY"
